<title>AI-экосистема Садыхан</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: корпоративная платформа — фирменная тёмно-бирюзовая навигация слева, светлая рабочая область справа (брендбук: «Bright space», «Pure»). */
:root{
  --bg:#F2F6F5; --panel:#FFFFFF; --panel-2:#EEF4F3; --line:#DCE7E5;
  --ink:#1A2B2D; --body:#33474A; --muted:#5E7174;
  --brand:#4DC2B0; --brand-d:#2D7C73; --brand-soft:#E2F4F1; --orange:#F47216; --orange-soft:#FDEBDD;
  --crit:#C2362F; --crit-soft:#FBE3E1; --warn:#B25A0C; --warn-soft:#FCEBDA; --amber:#D99A1E;
  --ok:#1F7A55; --ok-soft:#DFF2E8; --info:#2D6497; --info-soft:#E2ECF7;
  --side:#204D52; --side-2:#1A4145; --side-ink:#FFFFFF; --side-muted:rgba(255,255,255,.66); --side-hover:rgba(255,255,255,.08); --side-active:rgba(77,194,176,.24);
  --font:'Open Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 1px 2px rgba(20,50,50,.06),0 4px 14px rgba(20,50,50,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1C1D; --panel:#152627; --panel-2:#1B302F; --line:#2A4442; --ink:#EAF4F2; --body:#C8D9D6; --muted:#8FA6A3;
  --brand-d:#6FD6C5; --brand-soft:#173B37; --orange-soft:#3A2414; --crit:#F2827B; --crit-soft:#3B1D1B; --warn:#F0A55B; --warn-soft:#38281A; --amber:#E8B95A;
  --ok:#6CD29B; --ok-soft:#173325; --info:#8BB6EE; --info-soft:#1A2A3E; --side:#14363A; --side-2:#102E31; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1C1D; --panel:#152627; --panel-2:#1B302F; --line:#2A4442; --ink:#EAF4F2; --body:#C8D9D6; --muted:#8FA6A3;
  --brand-d:#6FD6C5; --brand-soft:#173B37; --orange-soft:#3A2414; --crit:#F2827B; --crit-soft:#3B1D1B; --warn:#F0A55B; --warn-soft:#38281A; --amber:#E8B95A;
  --ok:#6CD29B; --ok-soft:#173325; --info:#8BB6EE; --info-soft:#1A2A3E; --side:#14363A; --side-2:#102E31; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--body);font-family:var(--font);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--side)}
h1,h2,h3,h4{color:var(--ink);margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em} h2{font-size:17px;font-weight:700} h3{font-size:14.5px;font-weight:650} h4{font-size:13px;font-weight:650}
p{margin:0}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.lucide{width:18px;height:18px;stroke-width:1.9;flex-shrink:0}
.ico-sm svg.lucide{width:15px;height:15px}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100%}
/* Sidebar */
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;padding-left:env(safe-area-inset-left,0px)}
.brandbox{padding:20px 20px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.brandbox svg.logo{height:30px;width:auto;display:block}
.brandbox .tag{font-size:11.5px;color:var(--side-muted);margin-top:8px;letter-spacing:.02em}
.navsec{padding:14px 12px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--side-muted);font-weight:600}
.navbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:calc(100% - 16px);margin:1px 8px;padding:8px 10px;border-radius:8px;color:rgba(255,255,255,.88);font-size:13.5px;font-weight:500}
.navbtn:hover{background:var(--side-hover)}
.navbtn[aria-current="page"]{background:var(--side-active);color:#fff;font-weight:650;box-shadow:inset 3px 0 0 var(--brand)}
.navbtn:focus-visible{outline:2px solid var(--brand)}
.navbtn .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);padding:1px 8px;border-radius:999px}
.navbtn .cnt.hot{background:var(--orange);color:#fff}
.navsub .navbtn{padding-left:38px;font-size:13px;color:var(--side-muted)}
.navsub .navbtn[aria-current="page"]{color:#fff}
.sidefoot{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:11.5px;color:var(--side-muted)}
/* Main */
.mainc{min-width:0;display:flex;flex-direction:column}
.ribbon{background:var(--orange-soft);color:var(--warn);font-size:12.5px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.ribbon b{color:var(--warn)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;min-width:0;flex-wrap:wrap}
.crumbs b{color:var(--ink)}
.topbar .sp{flex:1}
.view{padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
/* Elements */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--panel-2)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.g6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.span2{grid-column:span 2}
.lead{color:var(--muted);max-width:80ch}
.small{font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-crit{background:var(--crit-soft);color:var(--crit)}
.p-info{background:var(--info-soft);color:var(--info)} .p-mute{background:var(--panel-2);color:var(--muted)} .p-brand{background:var(--brand-soft);color:var(--brand-d)} .p-or{background:var(--orange-soft);color:var(--warn)}
.p-sim{background:repeating-linear-gradient(135deg,var(--orange-soft) 0 6px,transparent 6px 12px);color:var(--warn);border:1px dashed var(--warn)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.or{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.kpi{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:26px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .d{font-size:11.5px;color:var(--muted)}
.kpi.accent{border-top:3px solid var(--brand)} .kpi.alert{border-top:3px solid var(--crit)} .kpi.or{border-top:3px solid var(--orange)}
.sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-h .sp{flex:1}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--panel-2);color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel-2)}
.agent{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;text-align:left;box-shadow:var(--shadow);min-width:0}
.agent:hover{border-color:var(--brand)}
.av{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-d);flex-shrink:0}
.av.pl{background:var(--orange-soft);color:var(--warn)}
.av.lg{width:56px;height:56px;border-radius:14px} .av.lg svg.lucide{width:28px;height:28px}
.stat{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)} .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.case{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;text-align:left;width:100%}
.case:hover{border-color:var(--brand)}
.case .t{color:var(--ink);font-weight:600}
.sevbar{width:4px;align-self:stretch;border-radius:2px;grid-row:span 2}
.steps{display:flex;flex-wrap:wrap;gap:4px;grid-column:2/-1}
.step{font-size:11px;padding:1px 8px;border-radius:6px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.step.ok{background:var(--ok-soft);color:var(--ok)} .step.bad{background:var(--warn-soft);color:var(--warn)} .step.crit{background:var(--crit-soft);color:var(--crit)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:9px 14px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--brand-d);border-bottom-color:var(--brand-d)}
.tab:focus-visible{outline:2px solid var(--brand)}
.lvl{border-left:3px solid var(--line);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:8px}
.lvl.l1{border-color:var(--info)} .lvl.l2{border-color:var(--brand)} .lvl.l3{border-color:var(--orange)} .lvl.dec{border-color:var(--ink)}
.claim{display:grid;grid-template-columns:112px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)} .claim:last-child{border-bottom:0}
.note{border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.note.warn{background:var(--warn-soft);color:var(--warn)} .note.info{background:var(--info-soft);color:var(--info)} .note.crit{background:var(--crit-soft);color:var(--crit)} .note.ok{background:var(--ok-soft);color:var(--ok)} .note.sim{background:var(--orange-soft);color:var(--warn);border:1px dashed var(--warn)}
.ai{white-space:pre-wrap}
details>summary{cursor:pointer;color:var(--brand-d);font-weight:600}
select,input[type=text],textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 12px;border-radius:10px;max-width:92%;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--brand-soft);color:var(--ink)} .msg.a{align-self:flex-start;background:var(--panel-2)}
.msg.tool{align-self:flex-start;font-size:11.5px;color:var(--muted);border:1px dashed var(--line);font-family:ui-monospace,Menlo,monospace}
.spin{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--brand-d);animation:sp .8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
.prog{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden} .prog>span{display:block;height:100%;background:var(--brand);transition:width .3s}
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.colk{background:var(--panel-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:220px}
.task{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left}
.task:hover{border-color:var(--brand)}
.task.over{border-left:3px solid var(--crit)}
.tl{display:flex;flex-direction:column;gap:0}
.tl .it{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;padding-bottom:10px;position:relative}
.tl .it::before{content:"";position:absolute;left:8px;top:16px;bottom:0;width:2px;background:var(--line)}
.tl .it:last-child::before{display:none}
.tl .dot{width:18px;height:18px;border-radius:50%;background:var(--brand-soft);border:2px solid var(--brand);margin-top:1px}
.tl .dot.sim{border-style:dashed;border-color:var(--orange);background:var(--orange-soft)}
.model{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);min-width:0}
.model .hd{display:flex;gap:10px;align-items:center}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.chart .ax{stroke:var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)} .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.heat td{text-align:center;font-weight:600;font-variant-numeric:tabular-nums;padding:8px 6px;border:2px solid var(--panel);border-radius:6px}
.heat th{text-align:center}
.heat td.lbl,.heat th.lbl{text-align:left;font-weight:500;background:transparent;color:var(--body);white-space:nowrap}
.feed{display:flex;flex-direction:column;gap:10px}
.feed .it{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
.feed .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--panel-2);color:var(--brand-d)}
.hide-m{} .menu-btn{display:none}
@media (max-width:1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g6{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:40;transform:translateX(-102%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
  .menu-btn{display:inline-flex}
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)} .g6{grid-template-columns:repeat(2,minmax(0,1fr))} .span2{grid-column:auto}
  .claim{grid-template-columns:minmax(0,1fr)} .hide-m{display:none}
}
@media (prefers-reduced-motion: reduce){.spin{animation:none}.side{transition:none}}
</style>

// ═════════════════════════ уровень 2: верификатор (независимая реализация) ═════════════════════════
function verify(f, W){
  const checks = []; const ok = (b, t) => checks.push({ ok:b, text:t }); let verdict = 'pass', note = '';
  const ids = new Set(W.receipts.map(x => x.id)); const cnt = p => { let c = 0; for (const x of W.receipts) if (p(x)) c++; return c; };
  switch (f.rule){
    case 'RET-01': { const [ph, c] = f.objects; const pd = {}; for (const x of W.receipts) if (x.ph === ph && x.cashier === c && x.status === 'deferred') pd[x.date] = (pd[x.date] || 0) + 1; const over = Object.entries(pd).filter(([, v]) => v > 5);
      ok(over.length > 0, `Пересчёт по исходным чекам: смен с >5 отложенными — ${over.length} (${over.map(([d, v]) => ruDate(d) + ': ' + v).join(', ')})`); ok(f.rows.every(x => ids.has(x.id)), `Все ${f.rows.length} чеков-доказательств найдены в источнике`); break; }
    case 'RET-02': { const [ph, c] = f.objects; const all = cnt(x => x.ph === ph && x.cashier === c), v = cnt(x => x.ph === ph && x.cashier === c && x.status === 'void'); ok(v / all > .02, `Пересчёт: ${v} аннулирований из ${all} чеков = ${pct(v / all)}`); break; }

Правила: числа — только из результатов функций; если данных нет — «данных недостаточно»; не делай выводов о вине людей; отличай отклонение от объяснимого исключения (проверь журналы компании).
Итог — простой текст без markdown, разделы: 1) Что проверено (какие данные, объём). 2) Найденные отклонения (с числами и объектами). 3) Что объясняется документами. 4) Оценка риска. 5) Корректирующие действия и ответственные роли. 6) Чего не хватает для вывода.`;
  try { if (S.tools){ const { text } = await S.sample(p, { tools, signal:autoCtl.signal, onText:({ text }) => { st.text = text; const el = document.getElementById('autoOut'); if (el) el.textContent = text; else if (S.route.page === 'agent') render(); } }); st.text = text; }
    else { const { text } = await S.sample(p + '\nДанные: ' + JSON.stringify(TOOLS(false)[0].execute({ pharmacy:'A3' })), { signal:autoCtl.signal, onText:({ text }) => { st.text = text; } }); st.text = text; }
    (S.runs[a.id] = S.runs[a.id] || []).unshift({ t:new Date().toTimeString().slice(0, 5), type:'Автономный ИИ-аудит: ' + proc, text:plural(st.log.length, 'запрос', 'запроса', 'запросов') + ' к данным' }); ev('sparkles', `${a.name}: автономный аудит «${proc}», ${plural(st.log.length, 'запрос', 'запроса', 'запросов')} к данным`); }

  st.busy = false; save(); render(); }

// ── Песочница
const SANDBOX = [['S1', 'violation', 'Кассир K-12 (Алматы-1) массово аннулирует оплаченные чеки'], ['S2', 'decoy', 'Возвраты без чека в Алматы-2, но с заявлениями и актами'], ['S3', 'violation', 'Новому оптовому клиенту отгружено 2,5 млн ₸ при лимите 1 млн ₸'],
  ['S4', 'decoy', 'Два одинаковых платежа за связь — за сентябрь и октябрь'], ['S5', 'violation', 'Отозванная серия продана в Шымкент-2'], ['S6', 'violation', 'Отложенные чеки с объяснением, написанным после выявления']];
V.sandbox = () => `<section class="col" style="gap:4px"><h1>Песочница</h1><p class="lead">Добавьте свои ситуации в тестовые данные и посмотрите, как агенты с ними справятся. Тип ситуации агенты не видят.</p></section>
  <section class="card col"><label class="row small"><input type="checkbox" id="hideAns" ${store.get('eco.hide', false) ? 'checked' : ''}> Скрыть ответы</label>
    ${SANDBOX.map(([id, k, t]) => `<label class="card flat row" style="justify-content:space-between;cursor:pointer"><span class="row"><input type="checkbox" data-sb="${id}" ${S.sandbox.includes(id) ? 'checked' : ''}> <b>${id}</b> ${esc(t)}</span>${store.get('eco.hide', false) ? '' : `<span class="pill ${k === 'violation' ? 'p-crit' : 'p-ok'}">${k === 'violation' ? 'нарушение' : 'ловушка'}</span>`}</label>`).join('')}
    <div class="row"><button class="btn pri" id="applySb">Применить и перезапустить агентов</button><button class="btn" id="resetAll">Сбросить демоверсию полностью</button></div>
    <p class="small">«Сбросить полностью» вернёт исходные данные, удалит задачи, результаты ИИ-проверок и историю совета в этом браузере.</p></section>`;
B.sandbox = () => { const h = document.getElementById('hideAns'); h.onchange = () => { store.set('eco.hide', h.checked); render(); };
  document.getElementById('applySb').onclick = () => { S.sandbox = [...document.querySelectorAll('[data-sb]')].filter(x => x.checked).map(x => x.dataset.sb); store.set('eco.sandbox', S.sandbox); rebuild(); ev('flask-conical', 'Песочница: добавлены сценарии ' + (S.sandbox.join(', ') || 'нет')); save(); go({ page:'cases' }); };
  const ra = document.getElementById('resetAll'); ra.onclick = () => { if (ra.dataset.confirm !== '1'){ ra.dataset.confirm = '1'; ra.textContent = 'Нажмите ещё раз для сброса'; return; }
    ['eco.sandbox', 'eco.fixed', 'eco.ai', 'eco.marks', 'eco.tests', 'eco.tasks', 'eco.council', 'eco.events', 'eco.runs', 'eco.shift'].forEach(k => { try { localStorage.removeItem(k); } catch {} });
    Object.assign(S, { sandbox:[], fixed:[], ai:{}, marks:{}, tests:{}, tasks:null, council:[], events:[], runs:{}, dayShift:0, mozg:null }); rebuild(); seedTasks(); seedEvents(); go({ page:'home' }); }; };

// ── Данные
const DATASETS = { receipts:['Чеки 1С', ['id', 'ph', 'cashier', 'date', 'time', 'amount', 'status', 'ref', 'card', 'bonus', 'promo']], revisions:['Ревизии', ['ph', 'date', 'act', 'turnover', 'shortage']], reviews:['Отзывы', ['id', 'ph', 'date', 'rating', 'source', 'answered']], promos:['Акции', ['id', 'name', 'from', 'to', 'order']],
  clients:['Оптовые клиенты', ['id', 'name', 'limit', 'debt', 'overdue']], shipments:['Отгрузки', ['id', 'client', 'date', 'amount']], limitChanges:['Изменения лимитов', ['client', 'date', 'from', 'to', 'user', 'approval']], esf:['ЭСФ', ['id', 'client', 'doc', 'docDate', 'issueDate', 'days']],
  aggOrders:['Заказы агрегаторов', ['id', 'channel', 'ph', 'date', 'amount', 'commission']], sales1C:['Продажи 1С по заказам', ['doc', 'orderRef', 'date', 'amount']], payments:['Платежи', ['id', 'date', 'recipient', 'amount', 'invoice', 'purpose', 'contract']],
  purchases:['Закупки', ['id', 'date', 'sku', 'supplier', 'qty', 'price']], offers:['Предложения поставщиков', ['sku', 'supplier', 'price', 'valid']], whInv:['Инвентаризации склада', ['act', 'date', 'book', 'diff']], batchSales:['Продажи по сериям', ['ph', 'batch', 'date', 'qty']], temps:['Логгеры температуры', ['device', 'place', 'date', 'start', 'minutes', 'max']],
  licenses:['Лицензии', ['ph', 'number', 'expires', 'renewalFiled']], users1C:['Пользователи 1С', ['login', 'name', 'role', 'active']], terminations:['Увольнения', ['login', 'name', 'date', 'order']], vacations:['Отпуска', ['cashier', 'ph', 'from', 'to', 'order']], context:['Журналы компании', ['id', 'date', 'source', 'text']] };
let dsSel = 'receipts', dsQ = '';
V.data = () => { const [t, cols] = DATASETS[dsSel]; const all = S.W[dsSel] || []; const rows = dsQ ? all.filter(r => cols.some(c => String(r[c] ?? '').toLowerCase().includes(dsQ.toLowerCase()))) : all;
  return `<section class="col" style="gap:4px"><h1>Тестовые данные</h1><p class="lead">Те же таблицы, которые видят агенты. Все аптеки, сотрудники, контрагенты и суммы выдуманы и не являются данными ГК.</p></section>
  <section class="card col"><div class="row"><label for="dsSel" class="small">Таблица</label><select id="dsSel">${Object.entries(DATASETS).map(([k, [n]]) => `<option value="${k}" ${k === dsSel ? 'selected' : ''}>${n} (${(S.W[k] || []).length})</option>`).join('')}</select><input type="text" id="dsQ" placeholder="Поиск: K-41, A3, AMX…" value="${esc(dsQ)}" aria-label="Поиск"></div><p class="small">${esc(t)}: строк ${rows.length}</p>${table(cols, rows, 200)}</section>`; };
B.data = () => { document.getElementById('dsSel').onchange = e => { dsSel = e.target.value; render(); }; const q = document.getElementById('dsQ'); q.onchange = () => { dsQ = q.value; render(); }; };

// ═════════════════════════ рендер ═════════════════════════
function render(){
  if (S.role === 'retail' && ['council'].includes(S.route.page)) S.route = { page:'home' };
  document.getElementById('nav').innerHTML = navItems(); document.getElementById('crumbs').innerHTML = crumbs();
  const a = document.getElementById('aiStatus'); a.className = 'pill ' + (S.sampleState === 'ready' ? 'p-ok' : S.sampleState === 'off' ? 'p-warn' : 'p-mute'); a.textContent = S.sampleState === 'ready' ? 'ИИ: Claude подключён' : S.sampleState === 'off' ? 'ИИ недоступен в этом окне' : 'ИИ: подключение…';
  const p = S.route.page; const fn = V[p] || V.home; document.getElementById('view').innerHTML = fn(); (B[p] || (() => {}))();
  document.querySelectorAll('[data-go]').forEach(el => { if (el.dataset.bound) return; el.dataset.bound = 1; el.addEventListener('click', e => { e.stopPropagation(); go(JSON.parse(el.dataset.go)); }); });
  if (p === 'agent') bindChat(S.route.id);
  if (window.lucide) try { window.lucide.createIcons({ attrs:{ 'aria-hidden':'true' } }); } catch {} }
function seedEvents(){ if (S.events.length) return; ev('refresh-cw', 'Плановая проверка 17.10 06:00: 13 аудиторов выполнили ' + Object.keys(RULES).length + ' процедур, найдено ' + S.F.length + ' отклонений (тестовая история)'); ev('scan-search', 'Верификатор отклонил ' + S.F.filter(f => f.ver.verdict !== 'pass').length + ' кейса: ошибки правил по формату данных'); ev('list-checks', 'Контроль исполнения: на контроле ' + (S.tasks || []).length + ' задач (тестовая история)', true); S.events.reverse(); save(); }
const rs = document.getElementById('roleSel'); rs.innerHTML = Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${S.role === k ? 'selected' : ''}>${v}</option>`).join('');
rs.onchange = () => { S.role = rs.value; store.set('eco.role', S.role); go({ page:'home' }); };
document.getElementById('menuBtn').onclick = () => document.getElementById('side').classList.toggle('open');
rebuild(); seedTasks(); seedEvents(); if (S.route.page === 'case' && !S.F.find(f => f.id === S.route.id)) S.route = { page:'home' }; render();
// ИИ подключается после первой отрисовки: страница работает и без него.
(async () => { try { S.sample = window.claude ? await window.claude.use('sample') : null; } catch { S.sample = null; }
  S.sampleState = S.sample ? 'ready' : 'off'; if (S.sample){ try { const l = await S.sample.limits(); S.tools = !!(l && l.tools); } catch { S.tools = false; } } render(); })();
</script>
