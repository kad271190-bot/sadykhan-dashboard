<title>Полигон AI-аудита</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: рабочий стол аудитора — навигация слева, рабочая область справа; на телефоне навигация становится горизонтальной лентой. */
:root{
  --bg:#F3F6F5; --panel:#FFFFFF; --panel-2:#EDF2F0; --line:#D7E1DE;
  --ink:#122A28; --body:#2C4240; --muted:#5B6F6C;
  --accent:#14786E; --accent-ink:#FFFFFF; --accent-soft:#DCEFEB;
  --warn:#A3500A; --warn-soft:#FBEAD8; --crit:#B3261E; --crit-soft:#FAE0DD;
  --ok:#1B7A4D; --ok-soft:#DCF1E5; --info:#2A5D9B; --info-soft:#E0EAF6;
  --font:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1918; --panel:#142322; --panel-2:#1A2D2B; --line:#29403D;
  --ink:#E8F2F0; --body:#C6D6D3; --muted:#8CA39F;
  --accent:#4CBFAF; --accent-ink:#04201C; --accent-soft:#163834;
  --warn:#F0A55B; --warn-soft:#382816; --crit:#F2827B; --crit-soft:#3B1C1A;
  --ok:#6CD29B; --ok-soft:#163225; --info:#8BB6EE; --info-soft:#19293E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1918; --panel:#142322; --panel-2:#1A2D2B; --line:#29403D;
  --ink:#E8F2F0; --body:#C6D6D3; --muted:#8CA39F;
  --accent:#4CBFAF; --accent-ink:#04201C; --accent-soft:#163834;
  --warn:#F0A55B; --warn-soft:#382816; --crit:#F2827B; --crit-soft:#3B1C1A;
  --ok:#6CD29B; --ok-soft:#163225; --info:#8BB6EE; --info-soft:#19293E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--body);font-family:var(--font);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
h1,h2,h3{color:var(--ink);text-wrap:balance;margin:0}
h1{font-size:18px;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;font-weight:650}
h3{font-size:14px;font-weight:650}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.top .sub{color:var(--muted);font-size:12.5px}
.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:550;white-space:nowrap;border:1px solid transparent}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-crit{background:var(--crit-soft);color:var(--crit)} .p-info{background:var(--info-soft);color:var(--info)}
.p-mute{background:var(--panel-2);color:var(--muted)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 60px)}
.nav{border-right:1px solid var(--line);background:var(--panel);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--body);font-weight:500}
.nav button:hover{background:var(--panel-2)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:650}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .navlabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 10px 4px}
.main{min-width:0;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card.soft{background:var(--panel-2)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.col{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lead{color:var(--muted);max-width:72ch}
.small{font-size:12.5px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px;font-weight:550}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12.5px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--mono);font-size:24px;color:var(--ink);font-weight:500}
.kpi .l{font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--panel-2);color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.finding{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;text-align:left;width:100%;color:inherit}
.finding:hover{border-color:var(--accent)}
.finding .t{color:var(--ink);font-weight:600}
.steps{display:flex;flex-wrap:wrap;gap:4px;grid-column:1/-1}
.step{font-size:11.5px;padding:1px 8px;border-radius:6px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.step.ok{background:var(--ok-soft);color:var(--ok)} .step.bad{background:var(--warn-soft);color:var(--warn)} .step.crit{background:var(--crit-soft);color:var(--crit)}
.level{border-left:3px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:8px}
.level.l1{border-color:var(--info)} .level.l2{border-color:var(--accent)} .level.l3{border-color:var(--warn)} .level.dec{border-color:var(--ink)}
.claim{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.claim:last-child{border-bottom:0}
.ai{white-space:pre-wrap;color:var(--body)}
.notice{border-radius:10px;padding:10px 12px;font-size:13px}
.notice.warn{background:var(--warn-soft);color:var(--warn)} .notice.info{background:var(--info-soft);color:var(--info)} .notice.crit{background:var(--crit-soft);color:var(--crit)}
.notice.ok{background:var(--ok-soft);color:var(--ok)}
details>summary{cursor:pointer;color:var(--accent);font-weight:550}
input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 12px;border-radius:10px;max-width:92%;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--accent-soft);color:var(--ink)}
.msg.a{align-self:flex-start;background:var(--panel-2);color:var(--body)}
.msg.tool{align-self:flex-start;font-family:var(--mono);font-size:11.5px;color:var(--muted);background:transparent;border:1px dashed var(--line)}
.bar{height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent)}
.spin{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-left,0px))}
  .nav .navlabel{display:none}
  .nav button{white-space:nowrap}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .claim{grid-template-columns:minmax(0,1fr)}
}
</style>

<header class="top">
  <div class="col" style="gap:0">
    <h1>Полигон AI-аудита</h1>
    <span class="sub">Демо-данные условной аптечной сети · 03–16 октября 2026</span>
  </div>
  <div class="spacer"></div>
  <span id="aiStatus" class="pill p-mute">ИИ: подключение…</span>
  <span id="dataStatus" class="pill p-acc">Данные: базовый набор</span>
</header>

<div class="shell">
  <nav class="nav" id="nav" aria-label="Разделы"></nav>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>

<script>
'use strict';
// ───────────────────────── helpers ─────────────────────────
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Math.round(n).toLocaleString('ru-RU') + ' ₸';
const pct = (x, d = 1) => (x * 100).toFixed(d).replace('.', ',') + '%';
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const DAYS = []; for (let d = new Date(Date.UTC(2026, 9, 3)); d <= new Date(Date.UTC(2026, 9, 16)); d.setUTCDate(d.getUTCDate() + 1)) DAYS.push(d.toISOString().slice(0, 10));
const dow = s => new Date(s + 'T12:00:00Z').getUTCDay(); // 5 = пятница
const hhmm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return n + ' ' + (m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? b : c); };
const ruDate = s => s.slice(8, 10) + '.' + s.slice(5, 7);
const store = { get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
                set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

// ───────────────────────── справочники ─────────────────────────
const PH = [
  { id:'A1', name:'Аптека Алматы-1' }, { id:'A2', name:'Аптека Алматы-2' }, { id:'A3', name:'Аптека Алматы-3' },
  { id:'A4', name:'Аптека Астана-7' }, { id:'A5', name:'Аптека Шымкент-2' }, { id:'A6', name:'Аптека Тараз-1' }];
const phName = id => (PH.find(p => p.id === id) || {}).name || id;
const cashiersOf = i => [1, 2, 3].map(k => 'K-' + i + k);

const AGENTS = [
  { id:'RET', name:'Аудитор аптечной сети', rules:['RET-01','RET-02','RET-03','RET-05','RET-06'],
    about:'Касса, возвраты, программа лояльности, ревизии. Источник: чеки 1С и акты ревизий.' },
  { id:'HRIT', name:'Аудитор кадров и доступов', rules:['HR-02','IT-01'],
    about:'Работа под чужим логином, доступы уволенных. Источник: 1С ЗУП, пользователи 1С, чеки.' },
  { id:'WHS', name:'Аудитор опта', rules:['WHS-01','WHS-02','WHS-03'],
    about:'Отгрузки, кредитные лимиты, просроченная дебиторка. Источник: 1С УТ.' },
  { id:'ECM', name:'Аудитор e-commerce', rules:['ECM-01','ECM-03'],
    about:'Сверка заказов агрегаторов с 1С, комиссии. Источник: отчёты агрегаторов, 1С.' },
  { id:'FIN', name:'Финансовый аудитор', rules:['FIN-01','FIN-02'],
    about:'Дубли платежей, платежи без договора. Источник: выписка банка, реестр договоров.' },
  { id:'QLT', name:'Аудитор качества GPP/GDP', rules:['QLT-01','QLT-02'],
    about:'Отзыв серий, холодовая цепь. Источник: продажи по сериям, уведомления, логгеры.' }];
const agentOf = rule => AGENTS.find(a => a.rules.includes(rule));

const RULES = {
  'RET-01':{ name:'Отложенные чеки у кассира', sev:'medium', auto:false, norm:'Демо-регламент СТ-03 «Кассовая дисциплина», п. 4.2: отложенный чек закрывается в течение смены. Более 5 отложенных чеков у одного кассира за смену требуют письменного объяснения заведующего. Исключение — сбой связи с ОФД, зарегистрированный в ИТ Service Desk до или во время смены.' },
  'RET-02':{ name:'Аннулирование чеков после оплаты', sev:'high', auto:false, norm:'Демо-регламент СТ-03, п. 4.4: аннулирование чека после оплаты допускается только с подтверждением заведующего. Доля аннулирований выше 2% чеков кассира за период — основание для проверки.' },
  'RET-03':{ name:'Возврат без исходного чека', sev:'medium', auto:false, norm:'Демо-регламент СТ-03, п. 6.3: возврат товара без кассового чека допускается только по письменному заявлению покупателя с документом, удостоверяющим личность, и оформленным актом возврата.' },
  'RET-05':{ name:'Аномальные покупки по картам лояльности', sev:'high', auto:false, norm:'Демо-правила лояльности ПЛ-01, п. 3.1: более 3 покупок по одной карте в одной аптеке за день требуют проверки, кроме корпоративных карт по договору. Ручное начисление бонусов сверх 3% запрещено.' },
  'RET-06':{ name:'Недостача по ревизии', sev:'medium', auto:true, norm:'Демо-регламент РВ-02 «Ревизии», п. 5.1: допустимая недостача — до 0,3% оборота аптеки за межревизионный период.' },
  'HR-02':{ name:'Операции под логином отсутствующего сотрудника', sev:'high', auto:false, norm:'Демо-регламент СТ-03, п. 2.1: работа под чужой учётной записью кассы запрещена.' },
  'IT-01':{ name:'Активная учётная запись уволенного', sev:'high', auto:true, norm:'Демо-политика ИБ-05, п. 3.4: учётная запись уволенного сотрудника блокируется не позднее 1 рабочего дня после увольнения.' },
  'WHS-01':{ name:'Отгрузка клиенту с просрочкой', sev:'high', auto:false, norm:'Демо-кредитная политика КП-01, п. 2.3: отгрузки клиенту с просрочкой более 30 дней приостанавливаются до погашения или решения директора опта.' },
  'WHS-02':{ name:'Отгрузка сверх кредитного лимита', sev:'high', auto:false, norm:'Демо-кредитная политика КП-01, п. 2.1: задолженность вместе с новой отгрузкой не должна превышать кредитный лимит.' },
  'WHS-03':{ name:'Изменение лимита без согласования', sev:'high', auto:false, norm:'Демо-кредитная политика КП-01, п. 4.1: кредитный лимит меняется только по согласованию директора опта; номер согласования вносится в карточку клиента в 1С.' },
  'ECM-01':{ name:'Заказ агрегатора не отражён в 1С', sev:'medium', auto:true, norm:'Демо-регламент ЭК-02, п. 3.2: каждый доставленный заказ агрегатора отражается в 1С документом продажи не позднее 24 часов.' },
  'ECM-03':{ name:'Комиссия агрегатора выше договорной', sev:'medium', auto:true, norm:'Демо-регламент ЭК-02, п. 5.1: фактическая комиссия агрегатора еженедельно сверяется со ставкой договора; превышение более 0,5 п.п. — расхождение.' },
  'FIN-01':{ name:'Возможный дубль платежа', sev:'high', auto:false, norm:'Демо-регламент ПЛ-04 «Платежи», п. 2.2: повторная оплата одного и того же счёта запрещена.' },
  'FIN-02':{ name:'Платёж без договора', sev:'high', auto:false, norm:'Демо-регламент ПЛ-04, п. 1.3: платёж без договора или иного документального основания запрещён.' },
  'QLT-01':{ name:'Продажа отозванной серии', sev:'critical', auto:false, norm:'Демо-СОП КК-07 «Отзыв серий», п. 2: с момента уведомления об отзыве продажа и перемещение серии запрещены, остатки переводятся в карантин.' },
  'QLT-02':{ name:'Выход температуры за 2–8 °C', sev:'critical', auto:false, norm:'Демо-СОП КК-03 «Холодовая цепь», п. 4: выход температуры за пределы 2–8 °C дольше 15 минут — отклонение, требующее оценки уполномоченного лица по качеству.' }};

// ───────────────────────── генерация мира ─────────────────────────
// Нарушения (V) и ловушки (D) закладываются явно и записываются в «правильные ответы» (gt).
// Детекторы правильных ответов не видят.
function buildWorld(sandbox){
  const r = rng(20261016);
  const W = { receipts:[], revisions:[], vacations:[], clients:[], shipments:[], limitChanges:[], aggOrders:[], sales1C:[],
    contracts:new Set(), payments:[], recalls:[], batchSales:[], temps:[], users1C:[], terminations:[], context:[], gt:[] };
  let rid = 1;
  const addR = o => { const x = Object.assign({ id:'Ч-' + String(rid++).padStart(5, '0'), status:'sale', ref:null, discount:0, card:null, bonus:0 }, o); W.receipts.push(x); return x; };
  W.vacations.push({ cashier:'K-33', ph:'A3', from:'2026-10-05', to:'2026-10-18', order:'Приказ О-212' });
  // обычные продажи
  PH.forEach((p, i) => {
    const cs = cashiersOf(i + 1);
    DAYS.forEach(day => {
      const n = 95 + Math.floor(r() * 30);
      for (let k = 0; k < n; k++){
        let c = cs[Math.floor(r() * 3)];
        if (c === 'K-33' && day >= '2026-10-05') c = r() < .5 ? 'K-31' : 'K-32';
        const t = 8 * 60 + Math.floor(r() * 14 * 60);
        const amount = 500 + Math.round(Math.pow(r(), 2) * 12000);
        const x = r(); let status = 'sale';
        if (x < .002) status = 'deferred'; else if (x < .006) status = 'void'; else if (x < .009) status = 'return';
        const card = r() < .38 ? 'C-' + (1000 + Math.floor(r() * 600)) : null;
        const rec = addR({ ph:p.id, cashier:c, date:day, time:hhmm(t), amount, status, card, bonus: card ? Math.round(amount * .03) : 0, discount: r() < .05 ? (r() < .5 ? 5 : 10) : 0 });
        if (status === 'return') rec.ref = 'Ч-' + String(Math.max(1, rid - 40 - Math.floor(r() * 200))).padStart(5, '0');
      }
    });
  });
  const gt = (id, kind, keys, title, why) => W.gt.push({ id, kind, keys, title, why });
  const ctx = (id, objects, date, source, text) => W.context.push({ id, objects, date, source, text });

  // V1 — отложенные чеки в конце смены (Астана-7, K-41)

  const by = (arr, keyf) => { const m = new Map(); arr.forEach(x => { const k = keyf(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }); return m; };
  // RET-01
  by(W.receipts.filter(x => x.status === 'deferred'), x => x.ph + '|' + x.cashier).forEach((rows, k) => {
    const [ph, c] = k.split('|'); const days = [...by(rows, x => x.date)].filter(([, v]) => v.length > 5);
    if (!days.length) return; const ev = days.flatMap(([, v]) => v);
    add({ rule:'RET-01', key:'RET-01|' + k, objects:[ph, c], title:`${phName(ph)}: кассир ${c} — более 5 отложенных чеков за смену (${plural(days.length, 'смена', 'смены', 'смен')})`,
      metric:{ label:'Максимум отложенных чеков за смену', value:Math.max(...days.map(([, v]) => v.length)), threshold:5 },
      facts:days.map(([d, v]) => `${ruDate(d)}: ${v.length} отложенных чеков, время ${v.map(x => x.time).sort()[0]}–${v.map(x => x.time).sort().slice(-1)[0]}, сумма ${money(v.reduce((a, x) => a + x.amount, 0))}`),
      cols:['id', 'date', 'time', 'cashier', 'amount', 'status'], rows:ev });
  });
  // RET-02
  by(W.receipts, x => x.ph + '|' + x.cashier).forEach((rows, k) => {
    const v = rows.filter(x => x.status === 'void'); const share = v.length / rows.length;
    if (share > .02 && v.length >= 5){ const [ph, c] = k.split('|');
      add({ rule:'RET-02', key:'RET-02|' + k, objects:[ph, c], title:`${phName(ph)}: кассир ${c} — аннулирований ${pct(share)} чеков`,
        metric:{ label:'Доля аннулирований', value:pct(share), threshold:'2%' },
        facts:[`Чеков кассира за период: ${rows.length}`, `Аннулировано после оплаты: ${v.length} на ${money(v.reduce((a, x) => a + x.amount, 0))}`, `Средняя доля по сети: ${pct(W.receipts.filter(x => x.status === 'void').length / W.receipts.length)}`],
        cols:['id', 'date', 'time', 'cashier', 'amount', 'status'], rows:v }); }
  });
  // RET-03
  by(W.receipts.filter(x => x.status === 'return' && !x.ref), x => x.ph + '|' + x.cashier).forEach((rows, k) => { const [ph, c] = k.split('|');
    add({ rule:'RET-03', key:'RET-03|' + k, objects:[ph, c], title:`${phName(ph)}: кассир ${c} — ${rows.length} возвратов без исходного чека`,
      metric:{ label:'Возвратов без чека', value:rows.length, threshold:0 }, facts:rows.map(x => `${x.id} ${ruDate(x.date)} ${x.time}: возврат ${money(x.amount)}, ссылка на чек продажи отсутствует`),
      cols:['id', 'date', 'time', 'cashier', 'amount', 'status', 'ref'], rows }); });
  // RET-05 (агрегация по аптеке)
  const cardDays = [...by(W.receipts.filter(x => x.card), x => x.ph + '|' + x.card + '|' + x.date)].filter(([, v]) => v.length > 3);
  by(cardDays, ([k]) => k.split('|')[0]).forEach((list, ph) => { const ev = list.flatMap(([, v]) => v); const cards = [...new Set(list.map(([k]) => k.split('|')[1]))];
    const bonusShare = ev.reduce((a, x) => a + x.bonus, 0) / ev.reduce((a, x) => a + x.amount, 0);
    add({ rule:'RET-05', key:'RET-05|' + ph, objects:[ph, ...cards], title:`${phName(ph)}: более 3 покупок в день по картам ${cards.join(', ')}`,
      metric:{ label:'Карт с превышением', value:cards.length, threshold:'>3 покупок/день' },
      facts:[...list.map(([k, v]) => `Карта ${k.split('|')[1]}, ${ruDate(k.split('|')[2])}: ${v.length} покупок на ${money(v.reduce((a, x) => a + x.amount, 0))}, кассиры ${[...new Set(v.map(x => x.cashier))].join('/')}`), `Средний начисленный бонус по этим покупкам: ${pct(bonusShare)} от суммы`],
      cols:['id', 'date', 'time', 'cashier', 'card', 'amount', 'bonus'], rows:ev }); });
  // RET-06
  W.revisions.forEach(v => { const s = v.shortage / v.turnover; if (s > .003) add({ rule:'RET-06', key:'RET-06|' + v.ph, objects:[v.ph], title:`${phName(v.ph)}: недостача ${pct(s, 2)} по ревизии ${v.act}`,
    metric:{ label:'Недостача от оборота', value:pct(s, 2), threshold:'0,30%' }, facts:[`Акт ${v.act} от ${ruDate(v.date)}`, `Оборот за период: ${money(v.turnover)}`, `Недостача: ${money(v.shortage)}`],
    cols:['ph', 'date', 'act', 'turnover', 'shortage'], rows:[v] }); });
  // HR-02
  W.vacations.forEach(v => { const rows = W.receipts.filter(x => x.cashier === v.cashier && x.date >= v.from && x.date <= v.to); if (!rows.length) return;
    add({ rule:'HR-02', key:'HR-02|' + v.ph + '|' + v.cashier, objects:[v.ph, v.cashier], title:`${phName(v.ph)}: ${rows.length} чеков под логином ${v.cashier} в период его отпуска`,
      metric:{ label:'Чеков в период отсутствия', value:rows.length, threshold:0 }, facts:[`Отсутствие по данным 1С ЗУП: ${ruDate(v.from)}–${ruDate(v.to)} (${v.order})`, ...[...by(rows, x => x.date)].map(([d, x]) => `${ruDate(d)}: ${x.length} чеков на ${money(x.reduce((a, y) => a + y.amount, 0))}`)],
      cols:['id', 'date', 'time', 'cashier', 'amount'], rows }); });
  // IT-01
  W.terminations.forEach(t => { const u = W.users1C.find(x => x.login === t.login); if (u && u.active) add({ rule:'IT-01', key:'IT-01|' + t.login, objects:[t.login], title:`Учётная запись ${t.login} (${u.role}) активна после увольнения ${ruDate(t.date)}`,
    metric:{ label:'Дней с увольнения', value:Math.round((Date.parse('2026-10-16') - Date.parse(t.date)) / 864e5), threshold:1 }, facts:[`Увольнение: ${t.order} от ${t.date}`, `Роль в 1С: ${u.role}, статус: активна`],
    cols:['login', 'name', 'role', 'active'], rows:[u] }); });
  // WHS-01, WHS-02
  W.clients.forEach(c => { const sh = W.shipments.filter(s => s.client === c.id);
    if (c.overdue > 30 && sh.length) add({ rule:'WHS-01', key:'WHS-01|' + c.id, objects:[c.id], title:`${c.name}: ${sh.length} отгрузки при просрочке ${c.overdue} дней`,
      metric:{ label:'Просрочка, дней', value:c.overdue, threshold:30 }, facts:[`Дебиторская задолженность: ${money(c.debt)}, лимит ${money(c.limit)}`, `Отгружено за период: ${money(sh.reduce((a, s) => a + s.amount, 0))}`], cols:['id', 'client', 'date', 'amount'], rows:sh });
    const big = sh.filter(s => c.debt + s.amount > c.limit && c.overdue <= 30);
    if (big.length) add({ rule:'WHS-02', key:'WHS-02|' + c.id, objects:[c.id], title:`${c.name}: отгрузка сверх кредитного лимита`,
      metric:{ label:'Задолженность + отгрузка', value:money(c.debt + Math.max(...big.map(s => s.amount))), threshold:money(c.limit) }, facts:big.map(s => `${s.id} ${ruDate(s.date)}: ${money(s.amount)} при задолженности ${money(c.debt)} и лимите ${money(c.limit)}`), cols:['id', 'client', 'date', 'amount'], rows:big }); });
  // WHS-03
  W.limitChanges.filter(l => !l.approval).forEach(l => { const c = W.clients.find(x => x.id === l.client);
    add({ rule:'WHS-03', key:'WHS-03|' + l.client, objects:[l.client], title:`${c.name}: лимит изменён ${money(l.from)} → ${money(l.to)} без номера согласования`,
      metric:{ label:'Номер согласования в 1С', value:'нет', threshold:'обязателен' }, facts:[`Изменение ${ruDate(l.date)} пользователем ${l.user}`, 'Поле «Согласование» в карточке клиента пустое'], cols:['client', 'date', 'from', 'to', 'user', 'approval'], rows:[l] }); });
  // ECM-01 — точное совпадение номера (наивное правило)
  const refs = new Set(W.sales1C.map(s => s.orderRef));
  by(W.aggOrders.filter(o => o.status === 'delivered' && o.date <= '2026-10-15' && !refs.has(o.id)), o => o.channel).forEach((rows, ch) =>
    add({ rule:'ECM-01', key:'ECM-01|' + ch, objects:[ch], title:`${ch}: ${rows.length} доставленных заказов без продажи в 1С`,
      metric:{ label:'Заказов без документа', value:rows.length, threshold:0 }, facts:[`Сумма: ${money(rows.reduce((a, o) => a + o.amount, 0))}`, 'Поиск в 1С по номеру заказа: не найдено'], cols:['id', 'channel', 'ph', 'date', 'amount'], rows }));
  // ECM-03
  by(W.aggOrders, o => o.channel).forEach((rows, ch) => { const eff = rows.reduce((a, o) => a + o.commission, 0) / rows.reduce((a, o) => a + o.amount, 0); const c = W.contractRates[ch];
    if (eff - c > .005) add({ rule:'ECM-03', key:'ECM-03|' + ch, objects:[ch], title:`${ch}: фактическая комиссия ${pct(eff)} при договорной ${pct(c)}`,
      metric:{ label:'Фактическая комиссия', value:pct(eff), threshold:pct(c) }, facts:[`Заказов: ${rows.length} на ${money(rows.reduce((a, o) => a + o.amount, 0))}`, `Удержано комиссии: ${money(rows.reduce((a, o) => a + o.commission, 0))}`, `По договору следовало: ${money(rows.reduce((a, o) => a + o.amount, 0) * c)}`],
      cols:['id', 'channel', 'date', 'amount', 'commission'], rows:rows.slice(0, 40) }); });
  // FIN-01 — наивное правило: получатель + сумма в пределах 10 дней
  by(W.payments, p => p.recipient + '|' + p.amount).forEach((rows, k) => { if (rows.length < 2) return; rows.sort((a, b) => a.date.localeCompare(b.date));
    if ((Date.parse(rows[rows.length - 1].date) - Date.parse(rows[0].date)) / 864e5 <= 10){ const [rec, am] = k.split('|');
      add({ rule:'FIN-01', key:'FIN-01|' + k, objects:[rec], title:`${rec}: ${rows.length} платежа по ${money(+am)} в пределах 10 дней`,
        metric:{ label:'Совпадающих платежей', value:rows.length, threshold:1 }, facts:rows.map(p => `${p.id} ${ruDate(p.date)}: ${money(p.amount)}, «${p.purpose}»`), cols:['id', 'date', 'recipient', 'amount', 'purpose'], rows }); } });
  // FIN-02
  W.payments.filter(p => !p.contract).forEach(p => add({ rule:'FIN-02', key:'FIN-02|' + p.recipient, objects:[p.recipient], title:`${p.recipient}: платёж ${money(p.amount)} без договора`,
    metric:{ label:'Договор в реестре', value:'нет', threshold:'обязателен' }, facts:[`${p.id} ${ruDate(p.date)}, назначение «${p.purpose}», счёт ${p.invoice}`], cols:['id', 'date', 'recipient', 'amount', 'invoice', 'purpose'], rows:[p] }));
  // QLT-01
  W.recalls.forEach(rc => by(W.batchSales.filter(s => s.batch === rc.batch && s.date >= rc.notice), s => s.ph).forEach((rows, ph) =>
    add({ rule:'QLT-01', key:'QLT-01|' + rc.batch + '|' + ph, objects:[ph, rc.batch], title:`${phName(ph)}: продажа отозванной серии ${rc.batch} после уведомления`,
      metric:{ label:'Продано упаковок после уведомления', value:rows.reduce((a, s) => a + s.qty, 0), threshold:0 }, facts:[`${rc.ref}`, ...rows.map(s => `${ruDate(s.date)}: продано ${s.qty} уп.`)], cols:['ph', 'batch', 'date', 'qty'], rows })));
  // QLT-02 — только по логгеру, без журнала ТО
  W.temps.filter(t => t.max > 8 && t.minutes > 15).forEach(t => add({ rule:'QLT-02', key:'QLT-02|' + t.device, objects:[t.ph, t.device], title:`${t.place}: ${t.device} — ${String(t.max).replace('.', ',')} °C в течение ${t.minutes} мин`,
    metric:{ label:'Длительность выхода за 8 °C', value:t.minutes + ' мин', threshold:'15 мин' }, facts:[`${ruDate(t.date)} с ${t.start}, максимум ${t.max} °C`], cols:['device', 'place', 'date', 'start', 'minutes', 'max'], rows:[t] }));
  return F;
}

// ───────────────────────── уровень 2: верификатор (отдельная реализация) ─────────────────────────
function verify(f, W){
  const checks = []; const ok = (b, t) => checks.push({ ok:b, text:t });
  const ids = new Set(W.receipts.map(x => x.id));
  const count = (pred) => { let c = 0; for (const x of W.receipts) if (pred(x)) c++; return c; };
  let verdict = 'pass', note = '';
  switch (f.rule){
    case 'RET-01': { const [ph, c] = f.objects; const perDay = {}; for (const x of W.receipts) if (x.ph === ph && x.cashier === c && x.status === 'deferred') perDay[x.date] = (perDay[x.date] || 0) + 1;
      const over = Object.entries(perDay).filter(([, v]) => v > 5); ok(over.length > 0, `Пересчёт по исходным чекам: смен с >5 отложенными — ${over.length} (${over.map(([d, v]) => ruDate(d) + ': ' + v).join(', ')})`);
      ok(f.rows.every(x => ids.has(x.id)), `Все ${f.rows.length} чеков-доказательств найдены в источнике`); if (!over.length) verdict = 'discrepancy'; break; }
    case 'RET-02': { const [ph, c] = f.objects; const all = count(x => x.ph === ph && x.cashier === c), v = count(x => x.ph === ph && x.cashier === c && x.status === 'void');
      ok(v / all > .02, `Пересчёт: ${v} аннулирований из ${all} чеков = ${pct(v / all)}`); if (v / all <= .02) verdict = 'discrepancy'; break; }
    case 'RET-03': { const bad = f.rows.filter(x => !W.receipts.some(y => y.id === x.id && y.status === 'return' && !y.ref)); ok(!bad.length, `Возвраты без ссылки на чек подтверждены по источнику: ${f.rows.length - bad.length} из ${f.rows.length}`);
      ok(true, 'Заявления и акты возврата в данных 1С не хранятся — их наличие верификатор проверить не может'); if (bad.length) verdict = 'discrepancy'; break; }
    case 'RET-05': { const ph = f.objects[0]; const m = {}; for (const x of W.receipts) if (x.ph === ph && x.card) { const k = x.card + x.date; m[k] = (m[k] || 0) + 1; }
      const n = Object.values(m).filter(v => v > 3).length; ok(n > 0, `Пересчёт: пар «карта-день» с >3 покупками — ${n}`); if (!n) verdict = 'discrepancy'; break; }
    case 'RET-06': { const v = W.revisions.find(x => x.ph === f.objects[0]); const turnover = W.receipts.filter(x => x.ph === v.ph && x.status === 'sale').reduce((a, x) => a + x.amount, 0);
      ok(Math.abs(turnover - v.turnover) < 1, `Оборот по чекам совпадает с актом: ${money(turnover)}`); ok(v.shortage / turnover > .003, `Недостача ${pct(v.shortage / turnover, 2)} > 0,30%`); break; }
    case 'HR-02': { const [, c] = f.objects; const vac = W.vacations.find(x => x.cashier === c); const n = count(x => x.cashier === c && x.date >= vac.from && x.date <= vac.to);
      ok(n > 0, `Пересчёт: ${n} чеков под ${c} в период ${ruDate(vac.from)}–${ruDate(vac.to)}`); ok(true, `Отпуск подтверждён документом ${vac.order}`); break; }
    case 'IT-01': { const u = W.users1C.find(x => x.login === f.objects[0]); const t = W.terminations.find(x => x.login === f.objects[0]);
      ok(!!u && u.active, `Учётная запись ${u ? (u.active ? 'активна' : 'заблокирована') : 'не найдена'} в выгрузке пользователей 1С`); ok(!!t, `Увольнение подтверждено: ${t ? t.order : 'нет документа'}`); break; }
    case 'WHS-01': case 'WHS-02': { const c = W.clients.find(x => x.id === f.objects[0]); const sum = W.shipments.filter(s => s.client === c.id).reduce((a, s) => a + s.amount, 0);
      ok(sum > 0, `Отгрузки клиенту найдены в источнике: ${money(sum)}`); ok(true, `Карточка клиента: лимит ${money(c.limit)}, задолженность ${money(c.debt)}, просрочка ${c.overdue} дн.`); break; }
    case 'WHS-03': { const l = W.limitChanges.find(x => x.client === f.objects[0]); ok(!l.approval, `В 1С поле согласования ${l.approval ? 'заполнено' : 'пустое'}`); ok(true, 'Другие системы согласований (Bitrix24) верификатору недоступны'); break; }
    case 'ECM-01': { // независимая сверка: номер без префикса, сумма и дата
      const norm = s => String(s).replace(/^[A-ZА-Я]+-/i, ''); let fuzzy = 0;
      f.rows.forEach(o => { if (W.sales1C.some(s => norm(s.orderRef) === norm(o.id) && s.amount === o.amount && s.date === o.date)) fuzzy++; });
      ok(fuzzy === 0, `Повторный поиск по номеру без префикса, сумме и дате: найдено ${fuzzy} из ${f.rows.length}`);
      if (fuzzy === f.rows.length){ verdict = 'discrepancy'; note = 'Все «пропавшие» заказы найдены в 1С: номер записан без префикса. Отклонение правила не подтверждено.'; }
      else if (fuzzy > 0){ verdict = 'discrepancy'; note = `Часть заказов (${fuzzy}) найдена в 1С — сумма расхождения завышена.`; } break; }
    case 'ECM-03': { const ch = f.objects[0]; const rows = W.aggOrders.filter(o => o.channel === ch); const eff = rows.reduce((a, o) => a + o.commission, 0) / rows.reduce((a, o) => a + o.amount, 0);
      ok(eff - W.contractRates[ch] > .005, `Пересчёт по всем ${rows.length} заказам: ${pct(eff, 2)} против ${pct(W.contractRates[ch], 2)} по договору`); break; }
    case 'FIN-01': { const inv = [...new Set(f.rows.map(p => p.invoice))]; ok(inv.length === 1, `Номера счетов: ${inv.join(', ')}`);
      if (inv.length > 1){ verdict = 'discrepancy'; note = 'Платежи по разным счетам — признак дубля не подтверждён.'; } break; }
    case 'FIN-02': ok(!W.contracts.has(f.objects[0]), `Получатель ${W.contracts.has(f.objects[0]) ? 'есть' : 'отсутствует'} в реестре договоров`); break;
    case 'QLT-01': { const [ph, b] = f.objects; const rc = W.recalls.find(x => x.batch === b); const q = W.batchSales.filter(s => s.ph === ph && s.batch === b && s.date >= rc.notice).reduce((a, s) => a + s.qty, 0);
      ok(q > 0, `Продажи серии после ${ruDate(rc.notice)}: ${q} уп.`); ok(true, `Уведомление: ${rc.ref}`); break; }
    case 'QLT-02': { const t = W.temps.find(x => x.device === f.objects[1]); ok(t.max > 8 && t.minutes > 15, `Лог устройства: ${t.max} °C, ${t.minutes} мин`); ok(true, 'Журнал ТО и перемещений товара верификатору недоступен'); break; }
  }
  if (checks.some(c => !c.ok) && verdict === 'pass') verdict = 'discrepancy';
  return { verdict, checks, note };
}

function promptAuditor(f){
  const ag = agentOf(f.rule);
  return `Ты — «${ag.name}», цифровой внутренний аудитор аптечной сети (уровень 1 трёхуровневой проверки). Данные полностью демонстрационные.
Твоя задача — сформировать ПРЕДВАРИТЕЛЬНОЕ заключение только по фактам ниже. Ты видишь только данные своей контрольной процедуры, других журналов компании у тебя нет.

Правила работы:

function promptReviewer(f, aud){

Норма: ${RULES[f.rule].norm}
Срабатывание правила: ${f.title}

Ответь только JSON:
{"risk":"low|medium|high|critical","risk_reason":"...","verdict":"confirm|needs_check|reject","verdict_reason":"...","issues":["логические ошибки, неподтверждённые утверждения, выход за полномочия"],"context_used":["id записей журнала, которые повлияли на вывод"],"blame_risk":false,"human_required":true}

function decide(f){
  const a = S.ai[aiKey(f)]; if (!a || !a.aud || !a.rev) return null;
  const aud = a.aud, rev = a.rev, v = f.ver;
  const mr = Math.max(rank[aud.risk] ?? 1, rank[rev.risk] ?? 1, rank[f.sev]);
  const reviewerDismiss = rev.verdict === 'reject';
  if (mr === 3) return { st:'specialist', rule:1, label:'Передан специалисту', why:'Критический риск. Уполномоченному лицу отправлен сигнал «Предварительный сигнал, требует проверки».' + (reviewerDismiss ? ' Ревьюер считает, что отклонение объяснено документами, — решение за специалистом.' : '') };
  if (rev.blame_risk || aud.personal_blame_suggested) return { st:'specialist', rule:2, label:'Передан специалисту', why:'Вывод затрагивает возможную вину конкретного сотрудника. Обвинительная задача ИИ не создаётся.' };
  if (v.verdict === 'insufficient') return { st:'docs', rule:3, label:'Запрошены документы', why:'Верификатору не хватает документов.' };
  if (v.verdict === 'discrepancy' || rev.verdict !== 'confirm' || Math.abs((rank[aud.risk] ?? 1) - (rank[rev.risk] ?? 1)) > 1)
    return { st:'check', rule:4, label:'Требуется дополнительная проверка', why:cap([v.verdict === 'discrepancy' ? 'верификатор нашёл расхождение' : '', rev.verdict === 'reject' ? 'ревьюер предлагает снять: отклонение объяснено документами' : rev.verdict === 'needs_check' ? 'у ревьюера есть сомнения' : '', Math.abs((rank[aud.risk] ?? 1) - (rank[rev.risk] ?? 1)) > 1 ? 'оценки риска разошлись больше чем на уровень' : ''].filter(Boolean).join('; ')) + '. Ревьюер может только ужесточить маршрут, поэтому снять кейс может только человек.' };
  if (RULES[f.rule].auto && mr <= 1) return { st:'task', rule:7, label:'Подтверждён ИИ-проверками · задача', why:'Все проверки пройдены, процедура разрешена к авто-постановке, риск не выше среднего.' };
  return { st:'wait', rule:8, label:'Подтверждён ИИ-проверками · ждёт контролёра', why:'Все проверки пройдены, но для этой процедуры или уровня риска нужна виза контролёра.' };
}

  </section>`;
}
let chatCtl = null;
async function ask(q){
  if (!S.sample || S.busy.chat || !q.trim()) return;
  S.chat.push({ role:'user', content:q }); S.busy.chat = true; render();
  const role = CHAT_ROLES[S.chatAgent];
  const rules = `Ты — «${role}», цифровой внутренний аудитор условной аптечной сети (данные демонстрационные, период 03–16.10.2026, аптеки A1–A6, кассиры K-11…K-63).
Правила: отвечай по-русски, коротко и по делу. Числа бери только из результатов функций${S.tools ? '' : ' или сводки'} — не выдумывай. Если нужных данных в системе нет, прямо скажи «данных недостаточно» и назови, каких. Не делай выводов о личной вине сотрудников — только об отклонениях и о том, что нужно проверить. В конце ответа перечисли, на какие данные опирался.`;
  const turns = [{ role:'user', content:rules }, ...S.chat.filter(m => m.role !== 'tool').map(m => ({ role:m.role === 'user' ? 'user' : 'assistant', content:m.content }))];
  if (!S.tools) turns[0].content += '\nСводка данных: ' + JSON.stringify({ pharmacies:TOOLS()[2].execute({}), findings:TOOLS()[7].execute({}) });
  const msg = { role:'assistant', content:'Думаю…' }; S.chat.push(msg); render();
  chatCtl = new AbortController();
  try {
    const tools = S.tools ? TOOLS().map(t => ({ ...t, execute:(inp) => { S.chat.splice(S.chat.indexOf(msg), 0, { role:'tool', content:'вызов ' + t.name + ' ' + JSON.stringify(inp || {}) }); render(); return t.execute(inp || {}); } })) : undefined;
    const { text } = await S.sample(turns, { cache:false, signal:chatCtl.signal, tools, onText:({ text }) => { msg.content = text; const el = document.getElementById('chatLog'); if (el && S.tab === 'chat'){ el.lastElementChild.textContent = text; } } });
    msg.content = text;
  } catch (e) { msg.content = (e.text ? e.text + '\n\n' : '') + (e.code === 'cancelled' ? 'Остановлено.' : aiErr(e)); }
  S.busy.chat = false; render();
}
bind.chat = () => {
  document.getElementById('agentSel').onchange = e => { S.chatAgent = e.target.value; };
  document.getElementById('clearChat').onclick = () => { S.chat = []; render(); };
  document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => ask(b.dataset.q));
  const inp = document.getElementById('chatIn'); document.getElementById('send').onclick = () => { const q = inp.value; inp.value = ''; ask(q); };
  inp.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); document.getElementById('send').click(); } };
  const st = document.getElementById('stop'); if (st) st.onclick = () => chatCtl && chatCtl.abort();
  if (!S.ran){ S.ran = true; rebuild(); }
};

2. Объекты, где сигналы разных агентов складываются в одну картину, — с перечнем кейсов и почему это вероятно связано.
3. Три приоритета на сегодня и кому их передать (роль, а не имя).
4. Что, вероятно, не является нарушением и почему (по вердиктам верификатора и ревьюера), — помня, что снимает кейс только человек.
5. Где данных недостаточно и что запросить.
Правила: не выдумывай фактов сверх данных; не делай выводов о вине людей; кейсы без ИИ-проверки называй предварительными.
Кейсы: ${JSON.stringify(items)}`;
  try { const { text } = await S.sample(p, { onText:({ text }) => { S.mozg = text; const el = document.getElementById('mozgOut'); if (el) el.textContent = text; else render(); } }); S.mozg = text; }
  catch (e) { S.mozg = (e.text || '') + '\n' + aiErr(e); }
  S.busy.mozg = false; render(); }; };

// ── Качество
function vQuality(){
  if (!S.ran) return `<section class="card"><p>Запустите агентов, чтобы увидеть метрики.</p></section>`;
  const G = S.W.gt; const flagged = g => S.F.filter(f => g.keys.includes(f.key));
  const outcome = g => { const fs = flagged(g); if (!fs.length) return { det:false };
    const ver = fs.every(f => f.ver.verdict === 'pass'); const ais = fs.map(f => S.ai[aiKey(f)] || {}); const rev = ais.every(a => a.rev) ? ais.map(a => a.rev.verdict) : null;
    const dec = fs.map(decide); return { det:true, ver, rev, dec }; };
  const rows = G.map(g => { const o = outcome(g);
    const good = g.kind === 'violation' ? (o.det && (!o.rev || o.rev.every(v => v !== 'reject'))) : (!o.det || !o.ver || (o.rev && o.rev.every(v => v !== 'confirm')));
    const stage = !o.det ? 'не найдено правилами' : !o.ver ? 'снято верификатором' : !o.rev ? 'ждёт ИИ-прогона' : o.rev.map(v => ({ confirm:'ревьюер подтвердил', needs_check:'ревьюер сомневается', reject:'ревьюер предлагает снять' })[v]).join(', ');
    return { g, o, good, stage }; });
  const vi = rows.filter(r => r.g.kind === 'violation'), de = rows.filter(r => r.g.kind === 'decoy');
  const decRule = de.filter(r => r.o.det).length, decVer = de.filter(r => r.o.det && r.o.ver).length;
  const decAI = de.filter(r => r.o.det && r.o.ver && r.o.rev).length, decAIconf = de.filter(r => r.o.det && r.o.ver && r.o.rev && r.o.rev.some(v => v === 'confirm')).length;
  const viFound = vi.filter(r => r.o.det).length, viAI = vi.filter(r => r.o.rev).length, viLost = vi.filter(r => r.o.rev && r.o.rev.some(v => v === 'reject')).length;
  const unplanned = S.F.filter(f => !gtOf(f)).length;
  const marks = Object.values(S.marks); const agree = marks.filter(m => m.v === 'agree').length;
  return `<section class="card col" style="gap:12px"><h2>Качество AI-аудита</h2>
    <p class="lead">Метрики считаются по заложенным правильным ответам. Ловушка, которую уровень пропустил дальше, — ложное срабатывание этого уровня.</p>
    <div class="grid3">
      <div class="kpi card soft"><span class="l">Нарушений найдено правилами</span><span class="v">${viFound} / ${vi.length}</span></div>
      <div class="kpi card soft"><span class="l">Ловушек подняли правила</span><span class="v">${decRule} / ${de.length}</span></div>
      <div class="kpi card soft"><span class="l">Ловушек осталось после верификатора</span><span class="v">${decVer} / ${decRule}</span></div>
      <div class="kpi card soft"><span class="l">Ловушек подтвердил ревьюер ИИ</span><span class="v">${decAIconf} / ${decAI}</span><span class="l">из прогнанных через ИИ</span></div>
      <div class="kpi card soft"><span class="l">Нарушений ревьюер ошибочно предложил снять</span><span class="v">${viLost} / ${viAI}</span><span class="l">из прогнанных через ИИ</span></div>
      <div class="kpi card soft"><span class="l">Ваше согласие с итогами</span><span class="v">${marks.length ? Math.round(agree / marks.length * 100) + '%' : '—'}</span><span class="l">оценено кейсов: ${marks.length}</span></div>
    </div>
    ${unplanned ? `<p class="small">Ещё ${unplanned} кейс(ов) правила нашли в случайном шуме данных, их нет среди заложенных ответов — оцените их сами.</p>` : ''}
    <div class="tablewrap"><table><thead><tr><th>Ответ</th><th>Тип</th><th>Ситуация</th><th>Где остановилось</th><th>Итог</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td class="mono">${r.g.id}</td><td><span class="pill ${r.g.kind === 'violation' ? 'p-crit' : 'p-ok'}">${r.g.kind === 'violation' ? 'нарушение' : 'ловушка'}</span></td><td>${esc(r.g.title)}</td><td>${esc(r.stage)}</td><td>${r.o.det && !r.o.rev && r.o.ver ? '<span class="pill p-mute">ждёт</span>' : `<span class="pill ${r.good ? 'p-ok' : 'p-crit'}">${r.good ? 'верно' : 'ошибка'}</span>`}</td></tr>`).join('')}
    </tbody></table></div>
  </section>`;
}
